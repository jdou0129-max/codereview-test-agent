[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codereview-test-agent"
version = "0.1.0"
description = "AI Code Review and Unit Test Generation Agent"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "CodeReview-Test Agent" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
codereview-agent = "codereview_test_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
